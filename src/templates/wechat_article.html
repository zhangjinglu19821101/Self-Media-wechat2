<!-- 文章标题 -->
<p style="margin:30px 0 10px 0; padding:0 12px; color:#000000; font-weight:bold; text-align:center; font-size:16px; line-height:1.7;">{{title}}</p>

<!-- 标题分割线 -->
<p style="text-align:center; margin:0 0 16px 0; padding:0;">
<span style="display:inline-block; width:60px; height:2px; background-color:#eee;"></span>
</p>

<!-- 作者+日期 -->
<p style="margin:0 0 20px 0; padding:0 12px; color:#666666; font-size:12px; line-height:1.5; text-align:center;">{{author}} · {{date}}</p>

<!-- 正文内容 -->
{{content}}
